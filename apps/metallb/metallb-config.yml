apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: wlan-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.2.240-192.168.2.250
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: wlan-l2adv
  namespace: metallb-system
spec:
  ipAddressPools:
    - wlan-pool
  # Both nodes name their WLAN interface wlan0 — scope ARP announcements to
  # that interface only, not the wired backend network.
  interfaces:
    - wlan0
  # NOT CURRENTLY USABLE for real client reachability - see
  # day1-foundation apps/metallb/README.md. The WiFi AP silently drops
  # gratuitous ARP for these IPs from both nodes (confirmed via tcpdump:
  # requests go out, zero replies) - almost certainly anti-ARP-spoofing
  # protection, since MetalLB's L2 mode *is* gratuitous ARP announcement
  # by design. A node's own real/DHCP-registered IP resolves fine over
  # the same WiFi; only claimed/floating IPs are blocked. This nodeSelector
  # restriction to pinode-01 was an earlier (incorrect) diagnosis when this
  # looked like a k8smaster-specific driver issue - tests "succeeding" from
  # either node were actually kube-proxy answering locally, not real
  # over-the-air ARP. Left in place but doesn't fix real reachability.
  nodeSelectors:
    - matchLabels:
        kubernetes.io/hostname: pinode-01
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: wired-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.1.2-192.168.1.9
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: wired-l2adv
  namespace: metallb-system
spec:
  ipAddressPools:
    - wired-pool
  # Interface name differs per node: k8smaster's wired NIC is end0,
  # pinode-01's is eth0.
  interfaces:
    - end0
    - eth0
---
# VLAN20 (Trusted) service pool, added 2026-09-03. This is the pool that
# actually gives MetalLB working L2 failover:
#
#  - wlan-pool cannot. The AP drops MetalLB's gratuitous ARP for claimed IPs
#    (see wlan-l2adv above), so those VIPs only ever worked through a /32
#    bound by hand on a node's wlan0 plus proxy_arp - a manual, node-pinned
#    arrangement that dies with that node and does not survive a reboot.
#  - wired-pool cannot either: 192.168.1.0/27 is the pre-VLAN20 backend, and
#    since 2026-08-30 both nodes' wired NICs sit on 192.168.20.0/24 instead.
#
# The range is the tail of the Trusted DHCP scope (192.168.20.6-.239, set in
# day0-infra-build's unifi-tf network.tf). Deliberate: DHCP on Trusted is
# being turned off, and until it is, the tail is the least likely part of the
# scope to be handed out. Shrink dhcp_stop to .229 when convenient.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: vlan20-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.20.230-192.168.20.239
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: vlan20-l2adv
  namespace: metallb-system
spec:
  ipAddressPools:
    - vlan20-pool
  # k8smaster's wired NIC is end0, pinode-01's is eth0 - both carry VLAN20
  # untagged since the 2026-08-30 migration.
  interfaces:
    - end0
    - eth0
  # No nodeSelectors, deliberately. This is the whole point of the pool:
  # either node may hold and announce these VIPs, so MetalLB can fail them
  # over instead of them dying with one hard-coded node.
