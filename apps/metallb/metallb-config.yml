# WLAN and the pre-VLAN20 wired pool were both removed on 2026-09-03.
#
# wlan-pool held the Pi-hole VIPs (.240 web, .245/.246 DNS). It never worked
# through MetalLB: the AP silently drops gratuitous ARP for claimed IPs, so
# those VIPs only ever resolved because a /32 was hand-bound on a node's
# wlan0 with proxy_arp (day0-infra-build's wlan-vips.yml) - node-pinned, and
# gone after a reboot. Both resolvers now live on vlan20-pool as
# 192.168.20.245/.246, keeping their last octets. Both nodes have since had
# wlan0 taken down entirely; the WLAN is no longer part of the topology.
#
# Removing it also fixed a real fault, not just tidiness: while k8smaster
# held 192.168.2.10/24 on wlan0, that directly-connected route beat the wired
# path for every 192.168.2.x destination. Any VIP served from k8smaster
# replied to LAN clients over a 24 Mbit/s half-duplex Wi-Fi link, which is
# what made Jellyfin stall for a minute at a time and recover.
#
# wired-pool was 192.168.1.2-9, the pre-VLAN20 backend. No node has had an
# interface on 192.168.1.0/27 since the 2026-08-30 migration, so it could
# never allocate. Removed rather than re-pointed - vlan20-pool covers this.

# VLAN20 (Trusted) service pool, added 2026-09-03. This is the pool that
# actually gives MetalLB working L2 failover:
#
#  - wlan-pool cannot. The AP drops MetalLB's gratuitous ARP for claimed IPs
#    (see wlan-l2adv above), so those VIPs only ever worked through a /32
#    bound by hand on a node's wlan0 plus proxy_arp - a manual, node-pinned
#    arrangement that dies with that node and does not survive a reboot.
#  - wired-pool cannot either: 192.168.1.0/27 is the pre-VLAN20 backend, and
#    since 2026-08-30 both nodes' wired NICs sit on 192.168.20.0/24 instead.
#
# The range is the tail of the Trusted DHCP scope (192.168.20.6-.239, set in
# day0-infra-build's unifi-tf network.tf). Deliberate: DHCP on Trusted is
# being turned off, and until it is, the tail is the least likely part of the
# scope to be handed out. Shrink dhcp_stop to .229 when convenient.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: vlan20-pool
  namespace: metallb-system
spec:
  addresses:
    # Extended to .250 on 2026-09-03 to take the Pi-hole VIPs off the WLAN.
    # .240-.250 deliberately mirrors the old wlan-pool range so the resolver
    # addresses keep their last octets (.245/.246 DNS, .240 web) and only the
    # subnet changes - less to relearn, and every doc that says "245 is
    # Pi-hole" stays true. It also sits outside the Trusted DHCP scope, which
    # is being shrunk to stop at .229 in the same change.
    - 192.168.20.230-192.168.20.250
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: vlan20-l2adv
  namespace: metallb-system
spec:
  ipAddressPools:
    - vlan20-pool
  # No `interfaces` list, deliberately. k8smaster's wired NIC is end0 and
  # pinode-01's is eth0, and MetalLB treats the list as a requirement every
  # eligible node must satisfy - naming both excluded both nodes, and the
  # test VIP came back with no allocated node at all (visible in
  # `kubectl get servicel2status -n metallb-system`, and invisible to curl
  # from a node, which kube-proxy answers locally whether or not anything is
  # ever announced on the wire). With no list, each node announces from
  # whichever of its own interfaces holds an address in the VIP's subnet,
  # which is exactly end0 and eth0 respectively.
  # No nodeSelectors, deliberately. This is the whole point of the pool:
  # either node may hold and announce these VIPs, so MetalLB can fail them
  # over instead of them dying with one hard-coded node.
