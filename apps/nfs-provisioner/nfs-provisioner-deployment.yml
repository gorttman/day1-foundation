apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-client-provisioner
  namespace: nfs-provisioner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nfs-client-provisioner
  template:
    metadata:
      labels:
        app: nfs-client-provisioner
    spec:
      serviceAccountName: nfs-client-provisioner
      containers:
        - name: nfs-client-provisioner
          image: registry.k8s.io/sig-storage/nfs-subdir-external-provisioner:v4.0.2
          volumeMounts:
            - name: nfs-client-root
              mountPath: /persistentvolumes
          env:
            - name: PROVISIONER_NAME
              value: k8s-sigs.io/nfs-subdir-external-provisioner
            - name: NFS_SERVER
              # 2026-08-30: hostname, not raw IP - resolved via /etc/hosts
              # on whichever node this pod lands on (same pattern as
              # roles/qnap_client), not DNS. See day0-infra-build's
              # effervescent-squishing-token plan / memory
              # project_vlan20_backend_migration.
              value: "k8smaster-nfs"
            - name: NFS_PATH
              value: "/srv/nfs/syslog-store"
      volumes:
        - name: nfs-client-root
          nfs:
            server: "k8smaster-nfs"
            path: "/srv/nfs/syslog-store"

