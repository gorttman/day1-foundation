apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cloudflared
  namespace: cloudflared
  labels:
    app: cloudflared
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/component: tunnel
    app.kubernetes.io/part-of: day1-foundation
    argocd.argoproj.io/managed-by: argocd
spec:
  # One per node (was a 2-replica Deployment with a soft spread that let
  # both land on k8smaster - found 2026-10-16, so a master outage took
  # both tunnel connections down). Cloudflare's guidance is "at least 2";
  # each copy holds its own set of connections to the edge. A DaemonSet
  # gives exactly one per node, follows a new node automatically, and
  # leaves no Pending pod behind when a node is down. No storage, tiny
  # image.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
        app.kubernetes.io/name: cloudflared
        app.kubernetes.io/component: tunnel
    spec:
      enableServiceLinks: false
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:2026.6.1
        imagePullPolicy: IfNotPresent
        # Token-based tunnel (created via the dashboard) - config is
        # remotely-managed in Cloudflare, no local config.yml here.
        # --metrics pins the /ready health server to containerPort 2000;
        # cloudflared's default (20241) doesn't match the probe otherwise.
        args:
        - --metrics
        - 0.0.0.0:2000
        - tunnel
        - run
        - --token
        - $(TUNNEL_TOKEN)
        env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflared-token
              key: TUNNEL_TOKEN
        ports:
        - name: metrics
          containerPort: 2000
          protocol: TCP
        resources:
          requests:
            memory: "32Mi"
            cpu: "20m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /ready
            port: 2000
          initialDelaySeconds: 20
          periodSeconds: 30
          failureThreshold: 3
