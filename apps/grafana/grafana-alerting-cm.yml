              report: "https://grafana.i3sec.com.au/d/cluster-overview/cluster-overview"
              next_step: "One of its two copies is missing. Longhorn rebuilds on its own; if it stays like this, check both nodes are up and have free disk (Longhorn node storage on the dashboard)."
          - uid: longhorn-volume-faulted
            title: "Longhorn volume faulted"
            condition: C
