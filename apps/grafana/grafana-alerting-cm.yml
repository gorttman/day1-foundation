              severity: critical
            annotations:
              summary: "Longhorn volume {{ $labels.pvc_namespace }}/{{ $labels.pvc }} is faulted and cannot be used"
              report: "https://grafana.i3sec.com.au/d/cluster-overview/cluster-overview"
              next_step: "Both copies are bad. The app using it will be down. Do not delete anything: check Longhorn in kube-system logs and both nodes before acting."
          - uid: node-disk-high
            title: "Node disk over 85% full"
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: influxdb-pilab
                model:
                  refId: A
                  query: |-
                    from(bucket: "telegraf")
                      |> range(start: -10m)
                      |> filter(fn: (r) => r._measurement == "disk" and r._field == "used_percent" and r.path == "/")
                      |> group(columns: ["host"])
                      |> last()
                      |> map(fn: (r) => ({_time: r._time, host: r.host, _value: float(v: r._value)}))
                      |> group(columns: ["host"])
              - refId: B
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
                  settings:
                    mode: dropNN
              - refId: C
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: gt
                        params: [85]
                      operator:
                        type: and
