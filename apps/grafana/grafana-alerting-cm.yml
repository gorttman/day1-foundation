                        params: ["C"]
                      reducer:
                        type: last
                      type: query
            noDataState: OK
            execErrState: Error
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Node {{ $labels.host }} disk is over 85% full"
              report: "https://grafana.i3sec.com.au/d/cluster-overview/cluster-overview"
              next_step: "See Root disk used % on the dashboard. Check what grew: container images, logs, or local volumes on that node."
          - uid: node-cpu-hot
            title: "Node CPU over 85C"
            # Added 2026-10-10 for the pinode-01 heat test. The Pi 5 slows down
            # from about 80C and harder at 85C; pinode-01 has no fan and its
            # Longhorn replicas failed while it sat at 85-88C.
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: influxdb-pilab
                model:
                  refId: A
                  query: |-
                    from(bucket: "telegraf")
                      |> range(start: -10m)
                      |> filter(fn: (r) => r._measurement == "temp" and r._field == "temp" and r.sensor == "cpu_thermal")
                      |> group(columns: ["host"])
                      |> last()
                      |> map(fn: (r) => ({_time: r._time, host: r.host, _value: float(v: r._value)}))
                      |> group(columns: ["host"])
              - refId: B
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
                  settings:
                    mode: dropNN
              - refId: C
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: gt
                        params: [85]
                      operator:
                        type: and
                      query:
                        params: ["C"]
                      reducer:
                        type: last
                      type: query
            noDataState: OK
            execErrState: Error
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.host }} CPU has been over 85C for 5 minutes (it slows down and storage can fail)"
              report: "https://grafana.i3sec.com.au/d/heat-longhorn/hardware-heat-vs-longhorn-pinode-01-test"
              next_step: "Open the heat dashboard: check the CPU clock and the blocked-process panel. Reduce what runs on that node, and add cooling if it is pinode-01 (it has no fan)."
          - uid: node-io-stall
            title: "Node processes stuck on disk"
            # Added 2026-10-10. The stall detector for the k8smaster "NFS wedge"
            # and the pinode-01 Longhorn faults: many processes blocked in disk
            # wait at once. It read 200+ when the Longhorn replicas failed.
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: influxdb-pilab
                model:
                  refId: A
                  query: |-
                    from(bucket: "telegraf")
                      |> range(start: -10m)
                      |> filter(fn: (r) => r._measurement == "processes" and r._field == "blocked")
                      |> group(columns: ["host"])
                      |> last()
                      |> map(fn: (r) => ({_time: r._time, host: r.host, _value: float(v: r._value)}))
                      |> group(columns: ["host"])
              - refId: B
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
                  settings:
                    mode: dropNN
              - refId: C
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: gt
                        params: [50]
                      operator:
                        type: and
                      query:
                        params: ["C"]
                      reducer:
                        type: last
                      type: query
            noDataState: OK
            execErrState: Error
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.host }} has had over 50 processes stuck waiting on disk for 5 minutes (storage or NFS stalled)"
              report: "https://grafana.i3sec.com.au/d/heat-longhorn/hardware-heat-vs-longhorn-pinode-01-test"
              next_step: "Open the dashboard and look at the NFS panels (retransmits, reconnects, QNAP port 2049) and the Longhorn events, to see whether the QNAP, the network or the node itself stalled. Do not reboot first: the evidence is on the dashboard now."
  backup-alerts.yml: |
    # Added 2026-10-05. The backup report page (reports app) already colours each
    # stream good, warn or crit; Telegraf copies that verdict into InfluxDB every
    # 10 minutes (apps/telegraf/conf/platform.conf) so it can be alerted on.
    #
    # Only CRIT alerts, never warn: the postgres stream shows warn most days
    # because dumps land on the QNAP about a day after they are taken. A stream
    # must be critical for a full 24 hours before this fires. Critical on the page
    # already means days stale (4+) or a source with no generation at all, so a
    # day of grace loses nothing, and it stops a known gap that clears overnight
    # (a source waiting for its first run) from messaging you.
    apiVersion: 1
    groups:
      - orgId: 1
        name: backups
        folder: Platform
        interval: 5m
        rules:
          - uid: backup-stream-critical
            title: "Backup stream critical for a day"
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: influxdb-pilab
                model:
                  refId: A
                  query: |-
                    import "strings"

                    from(bucket: "telegraf")
                      |> range(start: -40m)
                      |> filter(fn: (r) => r._measurement == "backup_status" and r._field =~ /^streams_/)
                      |> group(columns: ["_field"])
                      |> last()
                      |> map(fn: (r) => ({_time: r._time, stream: strings.trimPrefix(v: r._field, prefix: "streams_"), _value: if r._value == "crit" then 1.0 else 0.0}))
                      |> group(columns: ["stream"])
              - refId: B
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
                  settings:
                    mode: dropNN
              - refId: C
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: gt
                        params: [0]
                      operator:
                        type: and
                      query:
                        params: ["C"]
                      reducer:
                        type: last
                      type: query
            noDataState: OK
            execErrState: Error
            for: 24h
            labels:
              severity: critical
            annotations:
              summary: "Backups: the {{ $labels.stream }} stream has been critical for 24 hours"
              report: "https://reports.i3sec.com.au/backups/"
              next_step: "Open the Backups report: the red row names what is stale or missing. For qnap-snapshot, read /share/CACHEDEV1_DATA/.scripts/qnap-snapshot.log on the QNAP. For postgres, check the postgres-backup CronJob. For sealed-secrets, check the sealed-secrets-backup CronJob."
  media-alerts.yml: |
    # Added 2026-10-17 after Radarr OOM-crash-looped 122 times in 35 hours with
    # nothing alerting. Data: movie-status /api/alerts, scraped by Telegraf every
    # 5 minutes (apps/telegraf/conf/platform.conf).
    #
    # Restarts: one message per day at most (repeat is 24h for warnings), never
    # one per restart. A handful of restarts a day is a deploy or a VPN peer
    # rotation and is normal; more than 5 means something is crash-looping.
    #
    # Stuck downloads: movie-status records when it first saw each stuck item.
    # The threshold is 6 hours. Items the Clear button handles vanish within 30
    # minutes, so anything older means queue-clear is failing or the item needs
    # a person.
    apiVersion: 1
    groups:
      - orgId: 1
        name: media
        folder: Platform
        interval: 5m
        rules:
          - uid: media-stack-restarts
            title: "arr-stack restarting repeatedly"
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: influxdb-pilab
                model:
                  refId: A
                  query: |-
                    from(bucket: "telegraf")
                      |> range(start: -30m)
                      |> filter(fn: (r) => r._measurement == "media_pipeline" and r._field == "restarts24h")
                      |> last()
              - refId: B
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
                  settings:
                    mode: dropNN
              - refId: C
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: gt
                        params: [5]
                      operator:
                        type: and
                      query:
                        params: ["C"]
                      reducer:
                        type: last
                      type: query
            noDataState: OK
            execErrState: Error
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "arr-stack has restarted more than 5 times in 24 hours"
              report: "https://movie-status.i3sec.com.au/"
              next_step: "Open the status board, then run: kubectl -n arr-stack get pods and describe the arr-stack pod. Last State: OOMKilled means a container hit its memory limit; look at which one. Pod replaced often means the VPN healer is rotating the peer (git log shows arr-stack: vpn-healer auto-rotated)."
          - uid: media-download-stuck
            title: "Download stuck for hours"
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: influxdb-pilab
                model:
                  refId: A
                  query: |-
                    from(bucket: "telegraf")
                      |> range(start: -30m)
                      |> filter(fn: (r) => r._measurement == "media_pipeline" and r._field == "stuckOldestHours")
                      |> last()
              - refId: B
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
                  settings:
                    mode: dropNN
              - refId: C
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: gt
                        params: [6]
                      operator:
                        type: and
                      query:
                        params: ["C"]
                      reducer:
                        type: last
                      type: query
            noDataState: OK
            execErrState: Error
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "A download has been stuck for more than 6 hours"
              report: "https://movie-status.i3sec.com.au/"
              next_step: "Open the status board: Needs you lists what only a person can fix (usually a manual import in Radarr or Sonarr Activity, Queue). Or use the media-queue-fix skill. If the list is empty, check the queue-clear CronJob in arr-stack."
          - uid: media-pipeline-stalled
            title: "Downloads not moving"
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: influxdb-pilab
                model:
                  refId: A
                  query: |-
                    from(bucket: "telegraf")
                      |> range(start: -30m)
                      |> filter(fn: (r) => r._measurement == "media_pipeline" and r._field == "stallMinutes")
                      |> last()
              - refId: B
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
                  settings:
                    mode: dropNN
              - refId: C
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: gt
                        params: [120]
                      operator:
                        type: and
                      query:
                        params: ["C"]
                      reducer:
                        type: last
                      type: query
            noDataState: OK
            execErrState: Error
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Downloads have not made progress for more than 2 hours"
              report: "https://movie-status.i3sec.com.au/"
              next_step: "Usually the VPN: kubectl -n arr-stack get pods (arr-vpn), then the vpn-healer log. If the VPN is fine, look at qBittorrent / SABnzbd in the status board."
              description: >-
                Items are queued or downloading in Radarr, Sonarr or Whisparr, but none has fetched any more data or finished for 2+ hours (movie-status stallMinutes). The last two times this happened (7 and 10 September) the whole pipeline sat dead for hours with nothing complaining. This replaces the old download-stall-watch job, which needed the vault mount.
  logging-alerts.yml: |
    # Added 2026-10-18 for the Loki/Garage/Alloy logging stack. These watch the
    # pipeline itself. A missing-logs rule fires on no data or a query error, so
    # a Loki outage trips all of them, which is intended. UDM syslog is UDP:
    # anything sent while Loki is down is lost, not queued.
    apiVersion: 1
    groups:
      - orgId: 1
        name: logging-pipeline
        folder: Platform
        interval: 1m
        rules:
          - uid: logs-missing-k8smaster
            title: "Logs missing: k8smaster"
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: loki-pilab
                model:
                  refId: A
                  datasource:
                    type: loki
                    uid: loki-pilab
                  expr: 'sum(count_over_time({signal_type="host", node="k8smaster"}[10m]))'
                  queryType: instant
                  editorMode: code
              - refId: B
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
                  settings:
                    mode: dropNN
              - refId: C
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: lt
                        params: [1]
                      operator:
                        type: and
                      query:
                        params: ["C"]
                      reducer:
                        type: last
                      type: query
            noDataState: Alerting
            execErrState: Alerting
            for: 10m
            labels:
              severity: warning
            annotations:
              report: "https://grafana.i3sec.com.au/d/cluster-logs/cluster-logs"
              next_step: "kubectl get pods -n alloy -o wide; kubectl get pods -n loki. If only one node is quiet, check Alloy on it; if all three are, check loki-0 and garage-0."
              summary: "No host logs from k8smaster for 10 minutes"
              description: >-
                Loki has received no journald logs from k8smaster for 10+ minutes. Either Alloy on that node is not running or not shipping, the node is down, or Loki or its storage is unreachable (in which case the other nodes alert too).
          - uid: logs-missing-pinode-01
            title: "Logs missing: pinode-01"
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: loki-pilab
                model:
                  refId: A
                  datasource:
                    type: loki
                    uid: loki-pilab
                  expr: 'sum(count_over_time({signal_type="host", node="pinode-01"}[10m]))'
                  queryType: instant
                  editorMode: code
              - refId: B
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
                  settings:
                    mode: dropNN
              - refId: C
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: lt
                        params: [1]
                      operator:
                        type: and
                      query:
                        params: ["C"]
                      reducer:
                        type: last
                      type: query
            noDataState: Alerting
            execErrState: Alerting
            for: 10m
            labels:
              severity: warning
            annotations:
              report: "https://grafana.i3sec.com.au/d/cluster-logs/cluster-logs"
              next_step: "kubectl get pods -n alloy -o wide; kubectl get pods -n loki. If only one node is quiet, check Alloy on it; if all three are, check loki-0 and garage-0."
              summary: "No host logs from pinode-01 for 10 minutes"
              description: >-
                Loki has received no journald logs from pinode-01 for 10+ minutes. Either Alloy on that node is not running or not shipping, the node is down, or Loki or its storage is unreachable (in which case the other nodes alert too).
          - uid: logs-missing-pinode-02
            title: "Logs missing: pinode-02"
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: loki-pilab
                model:
                  refId: A
                  datasource:
                    type: loki
                    uid: loki-pilab
                  expr: 'sum(count_over_time({signal_type="host", node="pinode-02"}[10m]))'
                  queryType: instant
                  editorMode: code
              - refId: B
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
                  settings:
                    mode: dropNN
              - refId: C
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: lt
                        params: [1]
                      operator:
                        type: and
                      query:
                        params: ["C"]
                      reducer:
                        type: last
                      type: query
            noDataState: Alerting
            execErrState: Alerting
            for: 10m
            labels:
              severity: warning
            annotations:
              report: "https://grafana.i3sec.com.au/d/cluster-logs/cluster-logs"
              next_step: "kubectl get pods -n alloy -o wide; kubectl get pods -n loki. If only one node is quiet, check Alloy on it; if all three are, check loki-0 and garage-0."
              summary: "No host logs from pinode-02 for 10 minutes"
              description: >-
                Loki has received no journald logs from pinode-02 for 10+ minutes. Either Alloy on that node is not running or not shipping, the node is down, or Loki or its storage is unreachable (in which case the other nodes alert too).
          - uid: logs-udm-silent
            title: "UDM syslog silent"
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 1800
                  to: 0
                datasourceUid: loki-pilab
                model:
                  refId: A
                  datasource:
                    type: loki
                    uid: loki-pilab
                  expr: 'sum(count_over_time({app="udm"}[30m]))'
                  queryType: instant
                  editorMode: code
              - refId: B
                relativeTimeRange:
                  from: 1800
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
                  settings:
                    mode: dropNN
              - refId: C
                relativeTimeRange:
                  from: 1800
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: lt
                        params: [1]
                      operator:
                        type: and
                      query:
                        params: ["C"]
                      reducer:
                        type: last
                      type: query
            noDataState: Alerting
            execErrState: Alerting
            for: 5m
            labels:
              severity: warning
            annotations:
              report: "https://grafana.i3sec.com.au/d/cluster-logs/cluster-logs"
              next_step: "kubectl get svc alloy-syslog -n alloy (needs 192.168.20.231). Then check the UDM remote syslog setting (unifi-tf syslog.tf) and Alloy pod logs."
              summary: "No UDM syslog for 30 minutes"
              description: >-
                Nothing has arrived from the UDM at 192.168.20.231:514 for 30+ minutes. The UDM normally sends several hundred lines a minute. The remote-syslog setting may have been reset, or the Alloy receiver or its address is down.
          - uid: logs-qnap-silent
            title: "QNAP health samples silent"
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: loki-pilab
                model:
                  refId: A
                  datasource:
                    type: loki
                    uid: loki-pilab
                  expr: 'sum(count_over_time({app="qnap-nfsd"}[10m]))'
                  queryType: instant
                  editorMode: code
              - refId: B
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
                  settings:
                    mode: dropNN
              - refId: C
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: lt
                        params: [1]
                      operator:
                        type: and
                      query:
                        params: ["C"]
                      reducer:
                        type: last
                      type: query
            noDataState: Alerting
            execErrState: Alerting
            for: 5m
            labels:
              severity: warning
            annotations:
              report: "https://grafana.i3sec.com.au/d/cluster-logs/cluster-logs"
              next_step: "On the QNAP: crontab -l | grep log-shipper, then run /share/CACHEDEV1_DATA/.scripts/qnap-log-shipper.sh by hand. Then kubectl get svc alloy-syslog -n alloy (port 5514/udp). Re-push with: ansible-playbook qnap-manage.yml --tags manage_qnap_log_shipper,manage_qnap_cron"
              summary: "No QNAP health sample for 10 minutes"
              description: >-
                The QNAP log shipper sends a health line (uptime, load, memory, NFS server counters) every minute and none has arrived for 10+ minutes. The QNAP may be down or rebooting, its cron entry may be gone (a QTS firmware update can reset the live crontab), the script may be broken, or the Alloy QNAP receiver (192.168.20.231:5514/udp) is down. Until it is fixed, QNAP script logs, kernel and NFS server evidence are not reaching Loki.
          # 2026-10-19: matches the parsed level label, not the text 'level=error'. The
          # old text match also counted Loki's own info lines that quote this very query
          # (it contains 'level=error' and 's3'), so the rule fired permanently.
          - uid: logs-loki-storage-errors
            title: "Loki storage errors"
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: loki-pilab
                model:
                  refId: A
                  datasource:
                    type: loki
                    uid: loki-pilab
                  expr: 'sum(count_over_time({namespace="loki"} | logfmt | level="error" |~ "(?i)(flush|s3|garage|objstore|NoSuchBucket)" [10m]))'
                  queryType: instant
                  editorMode: code
              - refId: B
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
                  settings:
                    mode: dropNN
              - refId: C
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: gt
                        params: [5]
                      operator:
                        type: and
                      query:
                        params: ["C"]
                      reducer:
                        type: last
                      type: query
            noDataState: OK
            execErrState: Alerting
            for: 10m
            labels:
              severity: warning
            annotations:
              report: "https://grafana.i3sec.com.au/d/cluster-logs/cluster-logs"
              next_step: "kubectl logs -n loki loki-0 --tail=50; kubectl get pods -n loki garage-0; check the QNAP /cold share is mounted and has space."
              summary: "Loki is logging storage errors"
              description: >-
                Loki has logged more than 5 flush or object-store errors in 10 minutes. Garage or its QNAP /cold data directory may be unavailable or full, so new chunks are not being saved.
          - uid: log-rollup-stalled
            title: "Log rollup stalled"
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 14400
                  to: 0
                datasourceUid: influxdb-pilab
                model:
                  refId: A
                  query: >-
                    from(bucket: "log_rollup")
                      |> range(start: -4h)
                      |> filter(fn: (r) => r._measurement == "log_rollup_run" and r._field == "points")
                      |> last()
              - refId: B
                relativeTimeRange:
                  from: 14400
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
                  settings:
                    mode: dropNN
              - refId: C
                relativeTimeRange:
                  from: 14400
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: lt
                        params: [1]
                      operator:
                        type: and
                      query:
                        params: ["C"]
                      reducer:
                        type: last
                      type: query
            noDataState: Alerting
            execErrState: Alerting
            for: 5m
            labels:
              severity: warning
            annotations:
              report: "https://grafana.i3sec.com.au/d/log-rollup/log-rollup"
              next_step: "kubectl get cronjob,jobs -n monitoring | grep log-rollup; kubectl logs -n monitoring job/<latest log-rollup job>"
              summary: "No hourly log rollup for 4 hours"
              description: >-
                The log-rollup CronJob has not written its heartbeat to
                InfluxDB (bucket log_rollup) for 4+ hours, or wrote zero
                points. The long-term log summaries have a gap until it runs
                again. It can backfill: python3 log_rollup.py --hours N.
  infra-drift-alerts.yml: |
    # Added 2026-10-18. A nightly read-only plan of the Cloudflare and UniFi
    # Terraform stacks (systemd timer infra-drift-check on k8smaster, installed by
    # day0-infra-build/infra-drift-check.yml) writes measurement infra_drift.
    # drifted = resources whose plan is not empty and not on the known-benign list.
    # check_ok = 0 when the check itself failed. Nothing here ever applies a change.
    apiVersion: 1
    groups:
      - orgId: 1
        name: infra-drift
        folder: Platform
        interval: 30m
        rules:
          - uid: infra-drift
            title: "Infrastructure drift"
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: influxdb-pilab
                model:
                  refId: A
                  query: |-
                    from(bucket: "telegraf")
                      |> range(start: -36h)
                      |> filter(fn: (r) => r._measurement == "infra_drift" and r._field == "drifted")
                      |> group()
                      |> last()
              - refId: B
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
                  settings:
                    mode: dropNN
              - refId: C
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: gt
                        params: [0]
                      operator:
                        type: and
                      query:
                        params: ["C"]
                      reducer:
                        type: last
                      type: query
            noDataState: OK
            execErrState: Error
            for: 0s
            labels:
              severity: warning
            annotations:
              summary: "Cloudflare or UniFi no longer matches git"
              next_step: "Use the infra-apply skill: run the plan-only play for the stack, read what differs, and decide whether git or the live system is right. Run sudo /usr/local/sbin/infra-drift-check on k8smaster to see which stack."
          - uid: infra-drift-check-stale
            title: "Infrastructure drift check not running"
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: influxdb-pilab
                model:
                  refId: A
                  query: |-
                    from(bucket: "telegraf")
                      |> range(start: -36h)
                      |> filter(fn: (r) => r._measurement == "infra_drift" and r._field == "check_ok")
                      |> group()
                      |> min()
              - refId: B
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
                  settings:
                    mode: dropNN
              - refId: C
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: lt
                        params: [1]
                      operator:
                        type: and
                      query:
                        params: ["C"]
                      reducer:
                        type: last
                      type: query
            noDataState: Alerting
            execErrState: Alerting
            for: 0s
            labels:
              severity: warning
            annotations:
              summary: "The nightly infra drift check has not reported for 36 hours, or failed"
              next_step: "On k8smaster: systemctl status infra-drift-check.service and journalctl -u infra-drift-check -n 50. The check is read-only, so running sudo /usr/local/sbin/infra-drift-check by hand is safe."
