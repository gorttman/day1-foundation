# File-provisioned alert rules - same "provisioned = safe, UI edits
# overwritten on next sync" philosophy as grafana-dashboards-cm.yml.
# Added 2026-09-26 alongside the iCloud Migration dashboard, prompted
# directly by the Paperless consume queue sitting stuck at the same
# count for a full week with nobody noticing (see the icloud-migration
# project history) - this alert would have caught that within ~2-3h
# instead of a week.
#
# No contact point/notification-policy provisioning yet - this only
# provisions the rule itself, so it shows Alerting/red in the Grafana
# UI and via the alerting API, but doesn't send email/Slack/etc. Wire
# a contact point in a follow-up pass if actual notification delivery
# is wanted.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting
  namespace: monitoring
  labels:
    app: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: visualization
    argocd.argoproj.io/managed-by: argocd
data:
  icloud-migration-alerts.yml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: icloud-migration-alerts
        folder: Reports
        interval: 5m
        rules:
          - uid: icloud-migration-stuck-queue
            title: "iCloud migration: queue not draining"
            # Fires per distinct category/destination/status series that
            # matches the filter, so if more than one category is
            # "in_progress" at once, each gets its own independent alert
            # instance rather than one rule silently only watching one.
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 3600
                  to: 0
                datasourceUid: influxdb-pilab
                model:
                  refId: A
                  query: >-
                    from(bucket: "icloud_migration")
                      |> range(start: -1h)
                      |> filter(fn: (r) => r._measurement == "migration_status" and r._field == "percent_complete")
                      |> filter(fn: (r) => r.status == "in_progress")
                      |> group(columns: ["category"])
                      |> stddev()
                      |> map(fn: (r) => ({r with _field: "stddev_1h"}))
              - refId: C
                relativeTimeRange:
                  from: 3600
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: lt
                        params: [0.01]
                      operator:
                        type: and
                      query:
                        params: ["C"]
                      reducer:
                        type: last
                      type: query
            noDataState: OK
            execErrState: Error
            for: 2h
            labels:
              severity: warning
            annotations:
              report: "https://reports.i3sec.com.au/icloud-migration/"
              next_step: "Open the iCloud report and the Grafana dashboard. Check the Paperless or Immich consumer for that category is running."
              summary: "{{ $labels.category }} hasn't moved in over 2 hours while marked in_progress"
              description: >-
                percent_complete for category={{ $labels.category }} has had
                zero variation over the trailing hour, continuously for 2+
                hours, despite its status still being "in_progress". Likely
                a stalled consumer/process (this is exactly the pattern that
                let the Paperless consume queue sit stuck for a week
                unnoticed on 2026-09-18) - check the relevant service.
  platform-alerts.yml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: platform-alerts
        folder: Platform
        interval: 1m
        rules:
          - uid: node-load-per-core-high
            title: "Node load per core high"
            # Added after the 2026-09-26 k8smaster NFS hang (load ~2400 on 4
            # cores, ~600 per core) sat unnoticed for hours. Same rule-only
            # limitation as above: shows Alerting in the UI, no notification
            # channel is wired.
            #
            # Load average per core, per node, from Telegraf. Around 1 means
            # every core is busy. Normal load with the download stack running sits at
            # about 2.5 to 3 per core; the 2026-09-26 NFS hang reached about 600. The
            # threshold is 6 (raised from 2 on 2026-09-27, when 2 fired on normal load).
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: influxdb-pilab
                model:
                  refId: A
                  query: >-
                    from(bucket: "telegraf")
                      |> range(start: -10m)
                      |> filter(fn: (r) => r._measurement == "system" and (r._field == "load1" or r._field == "n_cpus"))
                      |> group(columns: ["host", "_field"])
                      |> last()
                      |> toFloat()
                      |> group(columns: ["host"])
                      |> pivot(rowKey: ["_time", "host"], columnKey: ["_field"], valueColumn: "_value")
                      |> map(fn: (r) => ({_time: r._time, host: r.host, _value: r.load1 / float(v: r.n_cpus)}))
                      |> group(columns: ["host"])
              - refId: B
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
                  settings:
                    mode: dropNN
              - refId: C
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: gt
                        params: [6]
                      operator:
                        type: and
                      query:
                        params: ["C"]
                      reducer:
                        type: last
                      type: query
            noDataState: NoData
            execErrState: Error
            for: 15m
            labels:
              severity: warning
            annotations:
              report: "https://grafana.i3sec.com.au/d/cluster-overview/cluster-overview"
              next_step: "Look for a hung NFS mount to the QNAP: ps -eLo stat,wchan:32,comm | grep '^D'. Then check the QNAP is reachable."
              summary: "{{ $labels.host }} load per core is above 6"
              description: >-
                {{ $labels.host }} has had more than 6 load-average units per
                CPU core for 15+ minutes. Check for processes stuck in
                uninterruptible I/O wait (ps -eLo stat,wchan:32,comm | grep '^D'),
                usually a hung NFS mount to the QNAP.

  capacity-and-availability-alerts.yml: |
    # Added 2026-10-05 after the Jellyfin outage (day2-services
    # apps/jellyfin/POSTMORTEM-2026-10-04.md): a config volume sat at 76% of
    # 8 GiB, Jellyfin refuses to start under 2 GiB free, and the first restart
    # took it down. Nothing watched volume usage, and nothing noticed Jellyfin
    # had been down for half an hour.
    #
    # Same convention as the other rules: no contact point is wired, so these
    # show red on Grafana's Alerting page (https://grafana.i3sec.com.au/alerting/list)
    # and nothing is sent anywhere. Volume stats come from Telegraf's
    # kubernetes_pod_volume (enabled in apps/telegraf/conf/node.conf).
    #
    # Pod readiness is NOT available from this Telegraf input (no readiness or
    # state tags), so "workload down" is a deadman: a critical container that
    # reports under 8 of the ~17 points it normally sends in 10 minutes is down
    # or flapping. Short-lived Job pods are excluded by listing the critical
    # containers explicitly.
    apiVersion: 1
    groups:
      - orgId: 1
        name: capacity-and-availability
        folder: Platform
        interval: 1m
        rules:
          - uid: volume-usage-warning
            title: "Volume more than 70% full"
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: influxdb-pilab
                model:
                  refId: A
                  query: |-
                    from(bucket: "telegraf")
                      |> range(start: -10m)
                      |> filter(fn: (r) => r._measurement == "kubernetes_pod_volume" and (r._field == "used_bytes" or r._field == "capacity_bytes"))
                      |> filter(fn: (r) => not (r.volume_name =~ /^kube-api-access/))
                      |> group(columns: ["namespace", "volume_name", "host", "_field"])
                      |> last()
                      |> toFloat()
                      |> group(columns: ["namespace", "volume_name", "host"])
                      |> pivot(rowKey: ["_time", "namespace", "volume_name", "host"], columnKey: ["_field"], valueColumn: "_value")
                      |> filter(fn: (r) => r.capacity_bytes > 1000000000.0)
                      |> map(fn: (r) => ({_time: r._time, namespace: if r.capacity_bytes > 1000000000000.0 then "qnap" else r.namespace, volume_name: if r.capacity_bytes > 1000000000000.0 then "media-share" else r.volume_name, host: if r.capacity_bytes > 1000000000000.0 then "all" else r.host, _value: r.used_bytes / r.capacity_bytes * 100.0}))
                      |> group(columns: ["namespace", "volume_name", "host"])
              - refId: B
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
                  settings:
                    mode: dropNN
              - refId: C
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: gt
                        params: [70]
                      operator:
                        type: and
                      query:
                        params: ["C"]
                      reducer:
                        type: last
                      type: query
            noDataState: NoData
            execErrState: Error
            for: 10m
            labels:
              severity: warning
            annotations:
              report: "https://grafana.i3sec.com.au/d/cluster-overview/cluster-overview"
              next_step: "See the Pod volumes table on the dashboard. To grow a volume, raise its storage size in git and let ArgoCD apply it, as was done for jellyfin-config on 2026-10-04. The QNAP share shows as one NFS row."
              summary: "{{ $labels.namespace }}/{{ $labels.volume_name }} on {{ $labels.host }} is over 70% full"
              description: >-
                A pod volume has been above 70% used for 10+ minutes. Grow it or clear it before it reaches 85%. Includes the QNAP NFS share (volume name media) as seen by any pod that mounts it. Jellyfin config volume: Jellyfin will not start with less than 2 GiB free.
          - uid: volume-usage-critical
            title: "Volume more than 85% full"
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: influxdb-pilab
                model:
                  refId: A
                  query: |-
                    from(bucket: "telegraf")
                      |> range(start: -10m)
                      |> filter(fn: (r) => r._measurement == "kubernetes_pod_volume" and (r._field == "used_bytes" or r._field == "capacity_bytes"))
                      |> filter(fn: (r) => not (r.volume_name =~ /^kube-api-access/))
                      |> group(columns: ["namespace", "volume_name", "host", "_field"])
                      |> last()
                      |> toFloat()
                      |> group(columns: ["namespace", "volume_name", "host"])
                      |> pivot(rowKey: ["_time", "namespace", "volume_name", "host"], columnKey: ["_field"], valueColumn: "_value")
                      |> filter(fn: (r) => r.capacity_bytes > 1000000000.0)
                      |> map(fn: (r) => ({_time: r._time, namespace: if r.capacity_bytes > 1000000000000.0 then "qnap" else r.namespace, volume_name: if r.capacity_bytes > 1000000000000.0 then "media-share" else r.volume_name, host: if r.capacity_bytes > 1000000000000.0 then "all" else r.host, _value: r.used_bytes / r.capacity_bytes * 100.0}))
                      |> group(columns: ["namespace", "volume_name", "host"])
              - refId: B
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
                  settings:
                    mode: dropNN
              - refId: C
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: gt
                        params: [85]
                      operator:
                        type: and
                      query:
                        params: ["C"]
                      reducer:
                        type: last
                      type: query
            noDataState: NoData
            execErrState: Error
            for: 5m
            labels:
              severity: critical
            annotations:
              report: "https://grafana.i3sec.com.au/d/cluster-overview/cluster-overview"
              next_step: "Act now. See the Pod volumes table on the dashboard. To grow a volume, raise its storage size in git and let ArgoCD apply it. For the QNAP share, free space on the QNAP."
              summary: "{{ $labels.namespace }}/{{ $labels.volume_name }} on {{ $labels.host }} is over 85% full"
              description: >-
                A pod volume has been above 85% used for 5+ minutes. Act now: grow the volume, or free space.
          - uid: critical-workload-down
            title: "Critical workload not running"
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: influxdb-pilab
                model:
                  refId: A
                  query: |-
                    import "array"

                    expected = array.from(rows: [
                      {key: "jellyfin/jellyfin", _value: 0},
                      {key: "arr-stack/radarr", _value: 0},
                      {key: "arr-stack/sonarr", _value: 0},
                      {key: "arr-stack/prowlarr", _value: 0},
                      {key: "arr-stack/sabnzbd", _value: 0},
                      {key: "arr-stack/qbittorrent", _value: 0},
                      {key: "arr-stack/gluetun", _value: 0},
                      {key: "reports/reports", _value: 0},
                      {key: "pihole/pihole", _value: 0},
                      {key: "postgres/postgres", _value: 0},
                      {key: "paperless/paperless", _value: 0},
                      {key: "immich/immich-server", _value: 0},
                      {key: "homeassistant/homeassistant", _value: 0},
                      // A workload switched off on purpose must be taken out of this list,
                      // or this rule reports it as down.
                      // Flux comments are // only. A # comment breaks the whole rule.
                      {key: "calibre-web/calibre-web", _value: 0},
                      {key: "cloudflared/cloudflared", _value: 0},
                      {key: "kube-system/traefik", _value: 0},
                      {key: "kube-system/coredns", _value: 0},
                      {key: "kube-system/sealed-secrets-controller", _value: 0},
                    ])

                    keys = expected |> findColumn(fn: (key) => true, column: "key")

                    actual = from(bucket: "telegraf")
                      |> range(start: -10m)
                      |> filter(fn: (r) => r._measurement == "kubernetes_pod_container" and r._field == "memory_working_set_bytes")
                      |> group(columns: ["namespace", "container_name"])
                      |> count()
                      |> map(fn: (r) => ({key: r.namespace + "/" + r.container_name, _value: r._value}))
                      |> filter(fn: (r) => contains(value: r.key, set: keys))

                    union(tables: [expected, actual])
                      |> group(columns: ["key"])
                      |> sum()
                      |> map(fn: (r) => ({key: r.key, _time: now(), _value: r._value}))
                      |> group(columns: ["key"])
              - refId: B
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
                  settings:
                    mode: dropNN
              - refId: C
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: lt
                        params: [8]
                      operator:
                        type: and
                      query:
                        params: ["C"]
                      reducer:
                        type: last
                      type: query
            noDataState: Alerting
            execErrState: Error
            for: 5m
            labels:
              severity: critical
            annotations:
              report: "https://grafana.i3sec.com.au/d/cluster-overview/cluster-overview"
              next_step: "Run: kubectl get pods -A | grep -v Running, and find the pod named in the alert. Pod CPU and memory are on the dashboard."
              summary: "{{ $labels.key }} is down or restarting repeatedly"
              description: >-
                This container sent fewer than 8 of its usual ~17 metric points in the last 10 minutes, for 5+ minutes. It is not running, or is crash-looping. Check the pod (kubectl get pods, kubectl describe). The list of critical containers is in this rule query.
  notifications.yml: |
    # Added 2026-10-05. Alerts are delivered to a Telegram bot chat. The bot
    # token and chat id come from the grafana-telegram Secret (sealed, loaded
    # through envFrom in grafana-deployment.yml) and are interpolated here by
    # Grafana's provisioning engine, the same way the datasource gets its
    # InfluxDB token. Created with apps/grafana/seal_telegram.sh.
    #
    # Note the policy REPLACES the default routing tree, and it makes the
    # previously silent rules (node load per core, iCloud migration) start
    # sending messages too.
    apiVersion: 1
    # Added 2026-10-10: the default Telegram message was a bare "Firing"
    # heading with raw labels below. This prints severity, alert name,
    # summary, next step and report link. Plain text on purpose (no
    # parse mode), so a stray character cannot break delivery.
    templates:
      - orgId: 1
        name: telegram_message
        template: |
          {{ define "tg.one" }}{{ if eq .Status "resolved" }}✅ Resolved - {{ else if eq .Labels.severity "critical" }}🔴 {{ else }}🟠 {{ end }}{{ if .Annotations.summary }}{{ .Annotations.summary }}{{ else }}{{ .Labels.alertname }}{{ end }}{{ if ne .Status "resolved" }}{{ if .Annotations.next_step }}

          What to do: {{ .Annotations.next_step }}{{ end }}{{ if .Annotations.report }}

          Report: {{ .Annotations.report }}{{ end }}{{ end }}{{ end }}
          {{ define "tg.message" }}{{ range .Alerts }}{{ template "tg.one" . }}

          {{ end }}{{ end }}

    contactPoints:
      - orgId: 1
        name: telegram
        receivers:
          - uid: telegram-alerts
            type: telegram
            settings:
              bottoken: $TELEGRAM_BOT_TOKEN
              # Literal on purpose. Interpolating the numeric id from an
              # environment variable made Grafana read it as a NUMBER, and
              # the telegram integration needs a string ("cannot unmarshal
              # number into Config.chatid of type string"), which stopped
              # Grafana starting at all (2026-10-05). A chat id is an
              # identifier, not a credential: only the bot token (above,
              # from the sealed secret) lets anyone send as the bot.
              chatid: "8200910175"
              message: '{{ template "tg.message" . }}'
            disableResolveMessage: false
    policies:
      - orgId: 1
        receiver: telegram
        group_by: ["alertname"]
        group_wait: 30s
        group_interval: 5m
        # Warnings are a nudge, not a page: repeat once a day while they last.
        repeat_interval: 24h
        routes:
          - receiver: telegram
            object_matchers:
              - ["severity", "=", "critical"]
            # Critical: repeat every 4 hours until it clears.
            repeat_interval: 4h
  cluster-health-alerts.yml: |
    # Added 2026-10-05. Certificates, ArgoCD, Longhorn and node disk, from data
    # Telegraf already collects (the prometheus measurement and disk). Each rule
    # has a "report" link (where to look) and a "next_step" in plain words; both
    # appear in the Telegram message because Grafana prints every annotation.
    #
    # No-data is treated as OK on purpose: for the ArgoCD and Longhorn rules an
    # empty result IS the healthy answer, and if Telegraf itself stops the
    # critical-workload-down rule already reports it.
    apiVersion: 1
    groups:
      - orgId: 1
        name: cluster-health
        folder: Platform
        interval: 1m
        rules:
          - uid: cert-expiring-warning
            title: "Certificate expires in under 14 days"
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: influxdb-pilab
                model:
                  refId: A
                  query: |-
                    from(bucket: "telegraf")
                      |> range(start: -15m)
                      |> filter(fn: (r) => r._measurement == "prometheus" and r._field == "certmanager_certificate_expiration_timestamp_seconds")
                      |> group(columns: ["namespace", "name"])
                      |> last()
                      |> map(fn: (r) => ({_time: r._time, namespace: r.namespace, name: r.name, _value: (float(v: r._value) - float(v: int(v: now())) / 1000000000.0) / 86400.0}))
                      |> group(columns: ["namespace", "name"])
              - refId: B
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
                  settings:
                    mode: dropNN
              - refId: C
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: lt
                        params: [14]
                      operator:
                        type: and
                      query:
                        params: ["C"]
                      reducer:
                        type: last
                      type: query
            noDataState: OK
            execErrState: Error
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in under 14 days"
              report: "https://grafana.i3sec.com.au/d/cluster-overview/cluster-overview"
              next_step: "cert-manager renews at 30 days left, so something is stuck. Look at Certificates on the dashboard, then run: kubectl -n {{ $labels.namespace }} describe certificate {{ $labels.name }}"
          - uid: cert-expiring-critical
            title: "Certificate expires in under 5 days"
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: influxdb-pilab
                model:
                  refId: A
                  query: |-
                    from(bucket: "telegraf")
                      |> range(start: -15m)
                      |> filter(fn: (r) => r._measurement == "prometheus" and r._field == "certmanager_certificate_expiration_timestamp_seconds")
                      |> group(columns: ["namespace", "name"])
                      |> last()
                      |> map(fn: (r) => ({_time: r._time, namespace: r.namespace, name: r.name, _value: (float(v: r._value) - float(v: int(v: now())) / 1000000000.0) / 86400.0}))
                      |> group(columns: ["namespace", "name"])
              - refId: B
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
                  settings:
                    mode: dropNN
              - refId: C
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: lt
                        params: [5]
                      operator:
                        type: and
                      query:
                        params: ["C"]
                      reducer:
                        type: last
                      type: query
            noDataState: OK
            execErrState: Error
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in under 5 days"
              report: "https://grafana.i3sec.com.au/d/cluster-overview/cluster-overview"
              next_step: "Act now or the site will show a certificate error. Run: kubectl -n {{ $labels.namespace }} describe certificate {{ $labels.name }} and look at the Events at the bottom."
          - uid: argocd-app-unhealthy
            title: "ArgoCD app unhealthy"
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: influxdb-pilab
                model:
                  refId: A
                  query: |-
                    from(bucket: "telegraf")
                      |> range(start: -4m)
                      |> filter(fn: (r) => r._measurement == "prometheus" and r._field == "argocd_app_info")
                      |> filter(fn: (r) => r.health_status == "Degraded" or r.health_status == "Missing")
                      |> group(columns: ["name", "health_status"])
                      |> last()
                      |> map(fn: (r) => ({_time: r._time, name: r.name, health_status: r.health_status, _value: float(v: r._value)}))
                      |> group(columns: ["name", "health_status"])
              - refId: B
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
                  settings:
                    mode: dropNN
              - refId: C
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: gt
                        params: [0]
                      operator:
                        type: and
                      query:
                        params: ["C"]
                      reducer:
                        type: last
                      type: query
            noDataState: OK
            execErrState: Error
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "ArgoCD app {{ $labels.name }} is {{ $labels.health_status }}"
              report: "https://argocd.i3sec.com.au/applications/argocd/{{ $labels.name }}"
              next_step: "Open the ArgoCD link: the red or broken resource is shown in the app tree. Often a pod crash-looping or a missing volume."
          - uid: argocd-app-out-of-sync
            title: "ArgoCD app out of sync for an hour"
            condition: C
            data:
              - refId: A
