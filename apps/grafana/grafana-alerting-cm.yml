                  from: 900
                  to: 0
                datasourceUid: influxdb-pilab
                model:
                  refId: A
                  query: |-
                    from(bucket: "telegraf")
                      |> range(start: -4m)
                      |> filter(fn: (r) => r._measurement == "prometheus" and r._field == "argocd_app_info")
                      |> filter(fn: (r) => r.sync_status == "OutOfSync")
                      |> group(columns: ["name"])
                      |> last()
                      |> map(fn: (r) => ({_time: r._time, name: r.name, _value: float(v: r._value)}))
                      |> group(columns: ["name"])
              - refId: B
