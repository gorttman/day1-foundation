            annotations:
              summary: "ArgoCD app {{ $labels.name }} has been out of sync for an hour"
              report: "https://argocd.i3sec.com.au/applications/argocd/{{ $labels.name }}"
              next_step: "Open the ArgoCD link and press Diff to see what differs from git. Sync it, or find what keeps reverting it."
          - uid: longhorn-volume-degraded
            title: "Longhorn volume degraded"
            condition: C
