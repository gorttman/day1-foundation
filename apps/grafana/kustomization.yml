apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

# Namespace is owned by the influxdb app (monitoring, part-of:
# observability) - reused here per convention, not redeclared, so two
# Argo apps don't fight over the same Namespace object.
resources:
  - grafana-sealed-secret.yml
  - grafana-telegram-sealed-secret.yml
  - grafana-pvc.yml
  - grafana-datasource-cm.yml
  - grafana-dashboard-provider-cm.yml
  - grafana-dashboards-cm.yml
  - grafana-alerting-cm.yml
  - grafana-deployment.yml
  - grafana-service.yml
  - grafana-ingress.yml

# Platform dashboards (Cluster Overview, AI Platform) live as plain JSON files
# in dashboards/. Fixed ConfigMap name (no hash suffix): Grafana's file provider
# rescans the mounted directory every 60s, so no pod restart is needed.
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: grafana-dashboards-platform
    files:
      - dashboards/cluster-overview.json
      - dashboards/ai-platform.json
      - dashboards/pinode-heat.json
      - dashboards/qnap.json
    options:
      labels:
        app: grafana
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: visualization
  # Same plain-JSON-file pattern as the Platform dashboards above, but
  # its own ConfigMap/provider/mount rather than added to the Platform
  # generator - lands in the Reports folder (alongside Subscriptions),
  # not Platform, since this is a personal project-tracking dashboard,
  # not cluster/AI-platform telemetry.
  - name: grafana-dashboards-icloud-migration
    files:
      - dashboards/icloud-migration.json
    options:
      labels:
        app: grafana
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: visualization
