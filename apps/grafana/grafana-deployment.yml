apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: visualization
    argocd.argoproj.io/managed-by: argocd
spec:
  replicas: 1
  # RWO local-path volume: old pod must release it before the new one starts
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: visualization
    spec:
      # workload-affinity: if Grafana ever gets a preferred home, wire in
      # the patch template from day2-services components/workload-affinity/
      # and add it to ansible/label-nodes.yml.
      #
      # No hard node pin: the data dir (SQLite) runs in a RAM emptyDir
      # with tar backups on nfs-client (pihole/kavita pattern), so
      # nothing needs k8smaster's local disk. Soft preference for the
      # infrastructure lane because the grafana image (~600MB) does not
      # fit pinode-01's 4G tmpfs image store - proven immediately when
      # the unpinned pod scheduled there and ImagePull ENOSPC'd. Soft
      # only: if k8smaster is down, scheduling elsewhere is still
      # allowed (and will work once pinode has a real disk).
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: lane
                operator: In
                values: ["infrastructure"]
      enableServiceLinks: false  # avoid injected <SVC>_PORT env vars (bit paperless)
      securityContext:
        fsGroup: 472  # grafana runs as uid/gid 472
      initContainers:
      # Restore the newest data backup into the RAM volume; fall back a
      # generation if the newest tar is torn.
      - name: data-restore
        image: busybox:1.36
        command: ["sh", "-c"]
        args:
        - |
          set -e
          if [ -f /backup/grafana-data.tar ] && tar -xf /backup/grafana-data.tar -C /data 2>/dev/null; then
            echo "restored grafana-data.tar"
          elif [ -f /backup/grafana-data.prev.tar ] && tar -xf /backup/grafana-data.prev.tar -C /data 2>/dev/null; then
            echo "restored grafana-data.prev.tar (newest was unreadable)"
          else
            echo "no backup found - starting fresh"
          fi
          chown -R 472:472 /data
          chmod 0775 /data
        volumeMounts:
        - name: data
          mountPath: /data
        - name: backup
          mountPath: /backup
      containers:
      - name: grafana
        image: grafana/grafana:13.0.3
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        # org/bucket/token for the provisioned datasource (interpolated
        # into grafana-datasources by Grafana's provisioning engine)
        envFrom:
        - secretRef:
            name: grafana-influxdb
        # Telegram bot token and chat id for the alert contact point
        # (grafana-alerting-cm.yml, notifications.yml). optional: true so
        # Grafana still starts if the controller has not created the Secret
        # yet; alerts then just cannot be delivered until it exists.
        - secretRef:
            name: grafana-telegram
            optional: true
        env:
        - name: GF_SERVER_ROOT_URL
          value: https://grafana.i3sec.com.au
        volumeMounts:
        - name: data
          mountPath: /var/lib/grafana
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
          readOnly: true
        - name: dashboard-provider
          mountPath: /etc/grafana/provisioning/dashboards
          readOnly: true
        - name: dashboards
          mountPath: /var/lib/grafana-dashboards/reports
          readOnly: true
        - name: dashboards-platform
          mountPath: /var/lib/grafana-dashboards/platform
          readOnly: true
        - name: dashboards-icloud-migration
          mountPath: /var/lib/grafana-dashboards/icloud-migration
          readOnly: true
        - name: alerting
          mountPath: /etc/grafana/provisioning/alerting
          readOnly: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 45
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      # Daily off-peak tar of the RAM data dir to the backup PVC with
      # one-generation rotation + size guard; final backup on shutdown
      # (preStop). Worst case after an unclean node death: up to ~24h of
      # dashboard edits lost (the provisioned datasource is a ConfigMap
      # and never at risk).
      - name: data-backup
        image: busybox:1.36
        command: ["sh", "-c"]
        args:
        - |
          backup() {
            tar -cf /backup/.tmp.tar -C /data --exclude=png --exclude=csv . || return 1
            sz=$(stat -c %s /backup/.tmp.tar 2>/dev/null || echo 0)
            if [ "$sz" -gt 10240 ]; then
              [ -f /backup/grafana-data.tar ] && cp /backup/grafana-data.tar /backup/grafana-data.prev.tar
              mv /backup/.tmp.tar /backup/grafana-data.tar
              echo "backup ok ($sz bytes) $(date)"
            else
              echo "backup skipped - suspiciously small ($sz bytes)"
              rm -f /backup/.tmp.tar
            fi
          }
          # Off-peak only: one backup per day, during 15:00-19:00 UTC
          # (~01:00-05:00 Australia/Sydney, DST-safe). Graceful restarts
          # are still captured immediately by the preStop hook below.
          while true; do
            h=$(date -u +%H); today=$(date -u +%Y%j)
            if [ "$h" -ge 15 ] && [ "$h" -lt 19 ] && [ "$(cat /backup/.last_backup_day 2>/dev/null)" != "$today" ]; then
              backup && echo "$today" > /backup/.last_backup_day
            fi
            sleep 1800
          done
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "tar -cf /backup/.tmp.tar -C /data --exclude=png --exclude=csv . && sz=$(stat -c %s /backup/.tmp.tar) && [ \"$sz\" -gt 10240 ] && { [ -f /backup/grafana-data.tar ] && cp /backup/grafana-data.tar /backup/grafana-data.prev.tar; mv /backup/.tmp.tar /backup/grafana-data.tar; } || rm -f /backup/.tmp.tar"]
        volumeMounts:
        - name: data
          mountPath: /data
          readOnly: true
        - name: backup
          mountPath: /backup
        resources:
          requests:
            memory: "16Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "200m"
      volumes:
      # RAM-backed; persisted via the sidecar/preStop backups above.
      - name: data
        emptyDir:
          medium: Memory
          sizeLimit: 512Mi
      - name: backup
        persistentVolumeClaim:
          claimName: grafana-data-backup
      - name: datasources
        configMap:
          name: grafana-datasources
      - name: dashboard-provider
        configMap:
          name: grafana-dashboard-provider
      - name: dashboards
        configMap:
          name: grafana-dashboards
      - name: dashboards-platform
        configMap:
          name: grafana-dashboards-platform
      - name: dashboards-icloud-migration
        configMap:
          name: grafana-dashboards-icloud-migration
      - name: alerting
        configMap:
          name: grafana-alerting
