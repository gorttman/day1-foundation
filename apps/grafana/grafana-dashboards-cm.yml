          },
          "options": {
            "showHeader": true
          },
          "gridPos": {
            "x": 0,
            "y": 37,
            "w": 24,
            "h": 10
          },
          "datasource": {
            "type": "influxdb",
            "uid": "influxdb-pilab"
          },
          "id": 10
