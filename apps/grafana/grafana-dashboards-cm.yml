                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "service"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Service"
                  },
                  {
                    "id": "custom.width",
                    "value": 210
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "status"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Status"
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background",
                      "mode": "basic"
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "active": {
                            "color": "green",
                            "text": "Active"
                          },
                          "review": {
                            "color": "orange",
                            "text": "Check"
                          },
                          "cancelled": {
                            "color": "red",
                            "text": "Cancelled"
                          }
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "Per month",
                "desc": true
              }
            ]
          },
          "gridPos": {
            "x": 0,
            "y": 25,
            "w": 24,
            "h": 12
          },
          "datasource": {
            "type": "influxdb",
            "uid": "influxdb-pilab"
          },
          "id": 9
        },
        {
          "type": "table",
          "title": "Recent charges",
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "influxdb",
                "uid": "influxdb-pilab"
              },
              "query": "from(bucket: \"subscriptions\") |> range(start: v.timeRangeStart, stop: v.timeRangeStop) |> filter(fn: (r) => r._measurement == \"sub_charge\" and r._field == \"amount_aud\") |> group() |> sort(columns: [\"_time\"], desc: true) |> limit(n: 40) |> keep(columns: [\"_time\",\"service\",\"via\",\"currency\",\"estimated\",\"_value\"])"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "_value"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "A$"
                  },
                  {
                    "id": "unit",
                    "value": "currencyAUD"
                  },
                  {
                    "id": "decimals",
                    "value": 2
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "_time"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Date"
                  },
                  {
                    "id": "unit",
                    "value": "time:YYYY-MM-DD"
                  }
