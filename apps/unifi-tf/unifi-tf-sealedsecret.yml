# Three fields sealed for real: TF_BACKEND_PG_CONN_STR (points at the
# unifi_tf database on the shared Postgres instance,
# day2-services/apps/postgres), TF_VAR_unifi_api_key (Network
# Application API key, created via Integrations > Create New API Key
# in the local UniFi Network app UI - not a Site Manager key, see
# HISTORY.md), and TF_VAR_wlan_arda_home_passphrase (the WPA
# pre-shared key for wlan.tf's ARDA_HOME WLAN, sealed 2026-08-05 once
# that resource was actually applied for real - see HISTORY.md #17).
# No expiry set on the API key itself (see HISTORY.md) - no rotation
# automation exists yet, so an expiring key would just break the
# unattended sync-hook Job silently.
#
# unifi_api_url is NOT sealed here - it's a plain, non-sensitive default
# in variables.tf (https://192.168.2.1), same treatment as
# cloudflare-tf's account_id/cloudflare_tunnel_id (identifiers, not
# credentials).
#
# To rotate any one field later without disturbing the others, seal just
# that value with kubeseal --raw (scope strict, namespace infra, name
# unifi-tf-secrets) and replace only its line below - kubeseal defaults
# to controller "sealed-secrets-controller" in "kube-system", which
# matches this cluster, so no extra flags are needed.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: unifi-tf-secrets
  namespace: infra
spec:
  encryptedData:
    TF_BACKEND_PG_CONN_STR: ""
    TF_VAR_unifi_api_key: ""
    TF_VAR_wlan_arda_home_passphrase: ""
  template:
    metadata:
      name: unifi-tf-secrets
      namespace: infra
    type: Opaque
