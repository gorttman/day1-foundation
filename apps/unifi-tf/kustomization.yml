apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: infra

resources:
  - unifi-tf-job.yml
  - unifi-tf-sealedsecret.yml

# Hash suffix intentionally LEFT ENABLED here — same reasoning as
# cloudflare-tf. See that app's README for the full explanation.
configMapGenerator:
  - name: unifi-tf-config
    files:
      - terraform/versions.tf
      - terraform/variables.tf
      - terraform/network.tf
      - terraform/wlan.tf
      - terraform/device.tf
      - terraform/firewall.tf
      - terraform/port-forward.tf
      - terraform/security-settings.tf
      - terraform/clients.tf
      # All validated via an out-of-band, plan-only dry-run against the
      # real shared backend before landing here (2026-08-10) - 0 to
      # destroy across every file. firewall.tf/port-forward.tf declare
      # no resources (both genuinely empty on this console) but are
      # included for completeness. NOT yet merged to main - see
      # HISTORY.md for why a real apply from an unmerged branch is
      # exactly the mistake that took down the house WiFi once already.
