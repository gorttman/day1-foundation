apiVersion: v1
kind: ServiceAccount
metadata:
  name: telegraf
  namespace: monitoring
  labels:
    app.kubernetes.io/name: telegraf
    app.kubernetes.io/part-of: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: telegraf-kubelet-stats
  labels:
    app.kubernetes.io/name: telegraf
    app.kubernetes.io/part-of: observability
rules:
  - apiGroups: [""]
    resources: ["nodes/stats", "nodes/metrics", "nodes/proxy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: telegraf-kubelet-stats
  labels:
    app.kubernetes.io/name: telegraf
    app.kubernetes.io/part-of: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: telegraf-kubelet-stats
subjects:
  - kind: ServiceAccount
    name: telegraf
    namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: telegraf-pod-discovery
  labels:
    app.kubernetes.io/name: telegraf
    app.kubernetes.io/part-of: observability
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: telegraf-pod-discovery
  labels:
    app.kubernetes.io/name: telegraf
    app.kubernetes.io/part-of: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: telegraf-pod-discovery
subjects:
  - kind: ServiceAccount
    name: telegraf
    namespace: monitoring
