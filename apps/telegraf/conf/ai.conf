[agent]
  interval = "30s"
  flush_interval = "30s"
  round_interval = true
  skip_processors_after_aggregators = true
  omit_hostname = true

[[outputs.influxdb_v2]]
  urls = ["http://influxdb.monitoring.svc.cluster.local:8086"]
  token = "$INFLUX_TOKEN"
  organization = "pilab"
  bucket = "ai_metrics"

[[inputs.prometheus]]
  urls = ["http://litellm.litellm.svc.cluster.local:4000/metrics"]
  metric_version = 2
  fieldinclude = ["litellm_*"]
  [inputs.prometheus.tags]
    service = "litellm"

# LiteLLM reports +Inf for keys and users that have no budget (the master key,
# the default user). InfluxDB line protocol cannot store infinity, and the
# write logged "serialization of metric(s) failed" every 30 s. Drop non-finite
# values here; a metric left with no fields is dropped entirely.
[[processors.starlark]]
  source = '''
def apply(metric):
    for k, v in list(metric.fields.items()):
        if type(v) == "float" and (v != v or v > 1.7e308 or v < -1.7e308):
            metric.fields.pop(k)
    for k in metric.fields:
        return metric
    return None
'''
