[agent]
  interval = "30s"
  flush_interval = "30s"
  round_interval = true
  skip_processors_after_aggregators = true
  omit_hostname = false
  hostname = "$NODE_NAME"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb.monitoring.svc.cluster.local:8086"]
  token = "$INFLUX_TOKEN"
  organization = "pilab"
  bucket = "telegraf"

[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = false

[[inputs.mem]]
[[inputs.swap]]
[[inputs.system]]
[[inputs.temp]]

[[inputs.disk]]
  mount_points = ["/"]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "overlay", "aufs", "squashfs"]

[[inputs.net]]
  interfaces = ["eth*", "end*", "wlan*"]

[[inputs.kubernetes]]
  url = "https://$HOST_IP:10250"
  bearer_token = "/var/run/secrets/kubernetes.io/serviceaccount/token"
  insecure_skip_verify = true
  # kubernetes_pod_volume added 2026-10-05 so a volume filling up is visible
  # (used_bytes / capacity_bytes per pod volume). Jellyfin refuses to start
  # with under 2 GiB free on its config volume and the outage on 2026-10-04
  # came from a volume at 76% that nobody was watching. See the pvc-usage
  # rules in apps/grafana/grafana-alerting-cm.yml.
  namepass = ["kubernetes_node", "kubernetes_pod_container", "kubernetes_pod_volume"]

# Added 2026-10-10 for the pinode-01 heat test (see the "Hardware heat test"
# item on the reports TODO page). pinode-01 has no fan and has run at 85-88C
# with Longhorn replicas failing; these values show whether heat is behind it.
# k8smaster is the control. All are tiny file reads every 30s.
#
# CPU clock: drops below the 2.4 GHz maximum (ondemand governor) when idle OR
# when the firmware throttles, so read it next to the load and temperature.
[[inputs.file]]
  name_override = "cpufreq"
  files = ["/hostfs/sys/devices/system/cpu/cpu0/cpufreq/scaling_cur_freq"]
  data_format = "value"
  data_type = "integer"

# Undervoltage alarm from the Pi firmware (1 = under-voltage seen). A weak
# power supply causes the same symptoms as heat, so it has to be ruled out.
[[inputs.file]]
  name_override = "rpi_undervoltage"
  files = ["/hostfs/sys/class/hwmon/hwmon*/in0_lcrit_alarm"]
  data_format = "value"
  data_type = "integer"

# Processes blocked on I/O (D state). The kernel here has pressure-stall
# info switched off, so this is the stall detector: it was 200+ at the
# moment the Longhorn replicas failed on 2026-10-10.
[[inputs.processes]]

# --- NFS wedge evidence (added 2026-10-10) -------------------------------
# k8smaster has "wedged" three times (09-26, 10-03, 10-08) with thousands of
# processes stuck on NFS to the QNAP, and the cause was never proven: client,
# network or the QNAP. These two inputs record what each side looked like
# DURING the next one, so it can be told apart afterwards.
#
# Client-side counters for the QNAP (retransmits, timeouts, TCP reconnects,
# request queue, wire time vs time queued in the client). The built-in
# nfsclient plugin cannot see the host's mounts from inside the pod, hence the
# script (conf/nfs-stats.sh, mounted next to this file).
[[inputs.exec]]
  commands = ["/bin/sh /etc/telegraf/nfs-stats.sh"]
  timeout = "10s"
  data_format = "influx"

# Can this node open a TCP connection to the QNAP's NFS port, and how fast.
# result != success while the client has stuck tasks = the QNAP or network.
[[inputs.net_response]]
  protocol = "tcp"
  address = "192.168.20.30:2049"
  timeout = "3s"
