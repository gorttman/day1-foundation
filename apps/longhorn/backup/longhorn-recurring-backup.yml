# Nightly Longhorn volume backups to the QNAP backup disk.
#
# Target (set on the default BackupTarget, also in longhorn-values.yml):
#   nfs://192.168.20.30:/backup/longhorn-backups
#   = /share/external/DEV3302_1/longhorn-backups on the QNAP. The /backup
#   export already allows the three nodes (qnap_nfs_exports.yml), so no QNAP
#   export change was needed. Folder created by hand once (mkdir).
#
# Why: until 2026-10-19 no Longhorn volume was backed up off-cluster; two
# replicas protect against a node failing, not against a volume being lost
# or corrupted. Postgres still has its own pg_dump stream; this covers the
# rest (InfluxDB, Jellyfin, arr configs, Loki/Garage, Grafana, HA ...).
#
# Every volume carries recurring-job-group.longhorn.io/default=enabled
# (Longhorn adds it), so groups: [default] covers all current and future
# volumes. To exclude one, label its Volume
# recurring-job-group.longhorn.io/default=disabled.
#
# 15:15 UTC = 02:15 AEDT. Moved from 07:15 UTC (18:15 AEDT) on 2026-11-02: the
# backup ran through the evening, when the household watches Jellyfin, and
# the QNAP (1 GB, end of life) stalled NFS mounts for the whole cluster.
# Evenings (about 16:00-23:00 local) are now a quiet window for heavy jobs.
# concurrency 1: one volume at a time (the QNAP is a 1 GB box).
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: nightly-backup
  namespace: longhorn-system
spec:
  name: nightly-backup
  task: backup
  cron: "15 15 * * *"
  retain: 14
  concurrency: 1
  groups:
    - default
  labels:
    schedule: nightly
