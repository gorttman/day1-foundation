apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: day1-foundation
  annotations:
    # After metallb (5) - Longhorn has no dependency on it, but this
    # keeps storage coming up after the network layer has settled.
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  sources:
    # Helm chart source. Version pinned deliberately (same discipline as
    # metallb's 0.16.1) - 1.11.3 is the latest patch of a settled minor
    # rather than the newest release (1.12.1 at time of writing).
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.11.3
      helm:
        valueFiles:
          - $values/apps/longhorn/longhorn-values.yml

    # Git repo containing the values file
    - repoURL: https://github.com/gorttman/day1-foundation.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system

  syncPolicy:
    automated:
      # prune deliberately FALSE. Longhorn owns real, replicated
      # application data; an accidental prune here is not a
      # "resync and move on" event. selfHeal still corrects drift.
      # Same reasoning as the unifi-tf caution documented in the root
      # apps/kustomization.yml.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

# ---------------------------------------------------------------------
# KNOWN BLOCKER, 2026-08-30 - Longhorn is NOT yet deployed.
#
# ArgoCD runs Helm's `pre-upgrade` hook as a PreSync hook even on a first
# install, where it is meaningless. That hook Job
# (longhorn-pre-upgrade) needs the `longhorn-service-account`
# ServiceAccount - which the chart only creates during the *Sync* phase,
# which cannot start until PreSync succeeds. Deadlock:
#
#   pods "longhorn-pre-upgrade-" is forbidden: error looking up service
#   account longhorn-system/longhorn-service-account: not found
#
# It retried ~20 times then hit DeadlineExceeded, and ArgoCD re-drove the
# same failing sync every few seconds. `automated` has been removed from
# the live Application to stop that loop; re-add it once the install
# path below is done. (Deleting the stuck Job also needs ArgoCD's own
# `argocd.argoproj.io/hook-finalizer` cleared first, or the delete hangs.)
#
# `spec.source.helm.skipHooks` is NOT available on this ArgoCD (v3.2.0 -
# verified against the live Application CRD), so that route is out.
#
# Recommended fix when picking this back up: perform the FIRST install
# outside ArgoCD (`helm install` into longhorn-system with these same
# values), which creates the ServiceAccount and RBAC properly, then
# re-enable `automated` here and let ArgoCD adopt the existing release.
# Every subsequent sync has the SA present, so the PreSync hook works as
# intended. Alternative: pre-create the SA + ClusterRole/Binding by hand
# before the first sync.
# ---------------------------------------------------------------------
