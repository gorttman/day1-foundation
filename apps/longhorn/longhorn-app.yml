apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: day1-foundation
  annotations:
    # After metallb (5) - Longhorn has no dependency on it, but this
    # keeps storage coming up after the network layer has settled.
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  sources:
    # Helm chart source. Version pinned deliberately (same discipline as
    # metallb's 0.16.1) - 1.11.3 is the latest patch of a settled minor
    # rather than the newest release (1.12.1 at time of writing).
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.11.3
      helm:
        valueFiles:
          - $values/apps/longhorn/longhorn-values.yml

    # Git repo containing the values file
    - repoURL: https://github.com/gorttman/day1-foundation.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system

  syncPolicy:
    automated:
      # prune deliberately FALSE. Longhorn owns real, replicated
      # application data; an accidental prune here is not a
      # "resync and move on" event. selfHeal still corrects drift.
      # Same reasoning as the unifi-tf caution documented in the root
      # apps/kustomization.yml.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

# ---------------------------------------------------------------------
# FIRST-INSTALL BLOCKER, 2026-08-30 - RESOLVED 2026-09-02.
#
# ArgoCD runs the chart's `pre-upgrade` hook as PreSync even on a first
# install, where it is meaningless. That Job needs the
# `longhorn-service-account` ServiceAccount, which the chart only creates
# during the Sync phase, which cannot start until PreSync passes.
#
# Fixed in longhorn-values.yml with `preUpgradeChecker.jobEnabled: false`,
# which is upstream's own documented answer for GitOps installs - the Job
# is then never rendered, so there is no PreSync hook to deadlock on. See
# the long comment in that file for why the two obvious alternatives
# (`spec.source.helm.skipHooks`, and hand-creating the SA + RBAC) do not
# work on this cluster.
#
# `automated` was removed from the LIVE Application on 2026-08-30 to stop
# it re-driving the failing sync every few seconds. It was never removed
# from this file, so restoring it is a patch on the live object to match
# git - not an edit here, and not a sync of the paused day1-foundation
# parent (which would re-assert `automated` on 13 other deliberately
# frozen children).
# ---------------------------------------------------------------------
