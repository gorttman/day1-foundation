apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quiet-window
  namespace: argocd
  labels:
    app.kubernetes.io/name: quiet-window
    app.kubernetes.io/part-of: day1-foundation
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default

  source:
    repoURL: https://github.com/gorttman/day1-foundation.git
    targetRevision: main
    path: apps/quiet-window

  destination:
    server: https://kubernetes.default.svc
    namespace: quiet-window

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  ignoreDifferences: []
