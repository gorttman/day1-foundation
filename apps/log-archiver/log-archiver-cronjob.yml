apiVersion: batch/v1
kind: CronJob
metadata:
  name: log-archiver
  namespace: logging
spec:
  # Re-enabled 2026-09-04. Disabled 2026-07-04 for failing and hanging
  # 20h+. All prerequisites re-verified: the secret exists, NAS_IP is
  # the current 192.168.20.30, and /syslog-archive exists and is
  # exported. The unbounded hang is fixed by activeDeadlineSeconds
  # below, so a stuck mount now fails in 30 minutes instead of
  # blocking until noticed.
  suspend: false
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          hostNetwork: true
          containers:
          - name: archiver
            image: alpine:latest
            command:
            - /bin/sh
            - -c
            - |
              apk add --no-cache bash nfs-utils iputils coreutils
              apk add --no-cache etherwake 2>/dev/null || true
              /scripts/archive-logs.sh
            env:
            - name: NAS_MAC_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: log-archiver-secret
                  key: NAS_MAC_ADDRESS
            - name: NAS_IP_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: log-archiver-secret
                  key: NAS_IP_ADDRESS
            - name: NFS_EXPORT_PATH
              valueFrom:
                secretKeyRef:
                  name: log-archiver-secret
                  key: NFS_EXPORT_PATH
            - name: ARCHIVE_DAYS
              valueFrom:
                secretKeyRef:
                  name: log-archiver-secret
                  key: ARCHIVE_DAYS
            volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: logs
              mountPath: /var/log/remote
            securityContext:
              privileged: true
          volumes:
          - name: scripts
            configMap:
              name: log-archiver-configmap
              defaultMode: 0755
          - name: logs
            persistentVolumeClaim:
              claimName: syslog-storage

