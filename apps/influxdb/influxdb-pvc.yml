apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: influxdb-data
  namespace: monitoring
  labels:
    app: influxdb
    app.kubernetes.io/name: influxdb
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: observability
    argocd.argoproj.io/managed-by: argocd
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 25Gi  # Changed from 10Gi
  # Longhorn since 2026-09-02 - replicated so the data follows the pod
  # instead of pinning it to one node. Migrated with day1-foundation's
  # migration/pvc_migrate.sh; the old local-path volume was staged and restored.
  storageClassName: longhorn  # k3s default storage class

