apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - infra-namespace/infra-namespace.yml
  # dhcpd, pxe-http, nfs-provisioner, nfs-server and portainer were removed
  # 2026-10-19 (all had been disabled/undeployed). Why, and how to restore them
  # from git: see ../RETIRED-APPS.md.
  # syslog-server and log-archiver removed 2026-10-18: replaced by Loki + Garage
  # + Alloy (day2-services apps/loki, garage, alloy). Recover from git history
  # (before this commit) if ever needed. Archived logs on the QNAP were not touched.
  - cert-manager/cert-manager-config-app.yml
  - metallb/metallb-app.yml
  - metallb/metallb-config-app.yml
  - qnap-storage/qnap-storage-app.yml
  - longhorn/longhorn-app.yml
  - influxdb/influxdb-app.yml
  - grafana/grafana-app.yml
  - telegraf/telegraf-app.yml
  - cloudflared/cloudflared-app.yml
  # unifi-tf relocated to day0-infra-build 2026-08-10, deliberately out
  # of ArgoCD entirely - it manages the live household UDM/gateway/APs,
  # and ArgoCD's own automated selfHeal is what turned an unrelated
  # commit into a real terraform destroy against the live WLAN on
  # 2026-08-05 (see day0-infra-build/unifi-tf/HISTORY.md #5). See
  # day0-infra-build/unifi-tf-apply.yml - a manually-run playbook now,
  # never automatic.
