apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - infra-namespace/infra-namespace.yml
  # dhcpd disabled 2026-09-03. It only ever declared subnet 192.168.1.0/27, the
  # pre-VLAN20 backend, and since the 2026-08-30 migration no node has an
  # interface on it - so isc-dhcp-server exited on every start with
  # "No subnet declaration for end0 (192.168.20.10) ... Not configured to
  # listen on any interfaces!", 117 restarts deep. Re-pointing it at
  # 192.168.20.0/24 is NOT the fix: the UDM already serves DHCP there, and
  # two DHCP servers on one segment is worse than none. The reservations and
  # PXE next-server/filename it carried are the UDM's job now; a future
  # netboot of a new node is the one thing this would need to come back for.
  # - dhcpd/dhcpd-app.yml
  # pxe-http disabled 2026-09-03, same reason dhcpd above was: it is the
  # other half of the same PXE stack (TFTP bootloader hand-off + HTTP
  # kernel/initrd/rootfs), and netboot has been dropped - nodes boot from
  # local storage now. Its boot config still points at
  # "nfsroot=nfs.i3sec.com.au:/nfs/rootfs", a path that is not what the
  # live NFS server exports any more. With dhcpd already gone nothing can
  # hand a client the next-server/filename that would reach this anyway,
  # so it was serving nobody. Manifests kept in apps/pxe-http/ - see that
  # README before ever re-enabling.
  # - pxe-http/pxe-http-app.yml
  # - portainer/portainer-app.yml  # disabled 2026-06-06 — intentional, config preserved in apps/portainer/
  # nfs-provisioner disabled 2026-09-03. Its backing export /srv/nfs/syslog-store
  # went away when syslog-storage moved to Longhorn, so the pod sat in
  # ContainerCreating retrying a mount that returns ENOENT. Nothing claims
  # the nfs-client StorageClass any more - every PVC is longhorn or
  # qnap-static.
  # - nfs-provisioner/nfs-provisioner-app.yml
  # syslog-server disabled 2026-09-03: nothing consumes it yet. Its PVC is
  # already on Longhorn, so re-enabling is just uncommenting this line.
  # - syslog-server/syslog-server-app.yml
  - log-archiver/log-archiver-app.yml
  - metallb/metallb-app.yml
  - metallb/metallb-config-app.yml
  - qnap-storage/qnap-storage-app.yml
  - longhorn/longhorn-app.yml
  - influxdb/influxdb-app.yml
  - grafana/grafana-app.yml
  - cloudflared/cloudflared-app.yml
  - cloudflare-tf/cloudflare-tf-app.yml
  # unifi-tf relocated to day0-infra-build 2026-08-10, deliberately out
  # of ArgoCD entirely - it manages the live household UDM/gateway/APs,
  # and ArgoCD's own automated selfHeal is what turned an unrelated
  # commit into a real terraform destroy against the live WLAN on
  # 2026-08-05 (see day0-infra-build/unifi-tf/HISTORY.md #5). See
  # day0-infra-build/unifi-tf-apply.yml - a manually-run playbook now,
  # never automatic.
