apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - infra-namespace/infra-namespace.yml
  - dhcpd/dhcpd-app.yml
  - pxe-http/pxe-http-app.yml
  # - portainer/portainer-app.yml  # disabled 2026-06-06 — intentional, config preserved in apps/portainer/
  - nfs-provisioner/nfs-provisioner-app.yml
  - syslog-server/syslog-server-app.yml
  - log-archiver/log-archiver-app.yml
  - metallb/metallb-app.yml
  - metallb/metallb-config-app.yml
  - qnap-storage/qnap-storage-app.yml
  - influxdb/influxdb-app.yml
  - grafana/grafana-app.yml
  - cloudflared/cloudflared-app.yml
  - cloudflare-tf/cloudflare-tf-app.yml
  # unifi-tf relocated to day0-infra-build 2026-08-10, deliberately out
