# Static NFS PersistentVolume onto a QNAP (valinor-m) share. One PV per
# QNAP directory - see README.md for the pattern and the prerequisites
# (FQDN resolution on every node via day0-infra-build's qnap_client role).
#
# path is /backup/active_backup/pihole, a subdirectory of the /backup
# export - deliberately not the export root, which still has an old,
# unverified rushed backup sitting on it from before this project
# existed (see day2-services project_qnap_backup_design memory).
#
# Migrated 2026-08-10 off nfs-client (k8smaster's own local disk) -
# this isn't just a "backup" volume despite the app-side naming, it's
# pihole's actual persistent config (setupVars.conf, custom lists,
# dhcp.leases, dnsmasq confs) plus the gravity-backup.db safety copy -
# real state with zero durability against a k8smaster disk failure.
#
# root-owned (0:0) on the QNAP side: pihole's gravity-backup sidecar
# and the fix-ftl-conf initContainer are both plain busybox containers
# with no securityContext, confirmed live - they run as literal root.
# /backup is no_root_squash (see day0-infra-build roles/qnap_exports),
# so this has to actually match, not just be convenient.
#
# accessModes is ReadWriteOnce - pihole is single-replica.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: qnap-pihole
  labels:
    app.kubernetes.io/part-of: qnap-storage
    argocd.argoproj.io/managed-by: argocd
spec:
  capacity:
    storage: 2Gi  # informational for NFS; not enforced
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: qnap-static
  mountOptions:
    - vers=4
    - noatime
  nfs:
    server: 192.168.1.30
    path: /backup/active_backup/pihole
