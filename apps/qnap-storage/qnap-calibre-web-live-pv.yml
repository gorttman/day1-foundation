# Static NFS PersistentVolume onto a QNAP (valinor-m) share. One PV per
# QNAP directory - see README.md for the pattern and the prerequisites
# (FQDN resolution on every node via day0-infra-build's qnap_client role).
#
# Replaces qnap-calibre-web-backup (qnap-calibre-web-backup-pv.yml) -
# that one points at /backup/active_backup/calibre-web, which meant its
# only copy sat inside the one directory tree the QNAP snapshot job
# deliberately excludes (it can't back up the backup disk into itself -
# see day0-infra-build roles/qnap_snapshot), so the periodic config tar
# backups it holds had zero generational history and zero protection if
# the backup disk itself failed. This PV points at /calibre-web instead,
# a real export on the QNAP's main pool (day0-infra-build
# variables/play/qnap_main_pool_dirs.yml,
# variables/play/qnap_nfs_exports.yml's qnap_nfs_new_exports) - the same
# live/backup separation every other app already has: live data on the
# main pool, generations on the backup disk via the snapshot job.
#
# Named qnap-calibre-web-live rather than reusing qnap-calibre-web-backup
# so both PVs can exist side by side during the copy-verify-cutover
# window - see README.md's migration section for the sequencing.
# qnap-calibre-web-backup and its backing active_backup/calibre-web
# directory get retired once this one is confirmed stable.
#
# root-owned (0:0) on the QNAP side, same as the old export - the
# config-backup sidecar is a plain busybox container with no
# securityContext, confirmed live - runs as literal root. /calibre-web
# is no_root_squash, so this has to actually match, not just be
# convenient.
#
# accessModes is ReadWriteOnce - calibre-web is single-replica.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: qnap-calibre-web-live
  labels:
    app.kubernetes.io/part-of: qnap-storage
    argocd.argoproj.io/managed-by: argocd
spec:
  capacity:
    storage: 2Gi  # informational for NFS; not enforced
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  # Explicit claimRef added 2026-09-03 while this PV is disabled, so that
  # re-enabling it with calibre-web is a one-line uncomment and not a
  # rebinding gamble - same reasoning as qnap-immich/paperless/vault. The
  # uid the binding controller writes back is covered by
  # ignoreDifferences in qnap-storage-app.yml.
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: calibre-web
    name: calibre-web-config-backup
  storageClassName: qnap-static
  mountOptions:
    - vers=4
    - noatime
  nfs:
    server: qnap
    path: /calibre-web
