apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qnap-storage
  namespace: argocd
  labels:
    app.kubernetes.io/name: qnap-storage
    app.kubernetes.io/part-of: day1-foundation
  annotations:
    argocd.argoproj.io/sync-wave: "5"  # PVs before the day2 apps that claim them
spec:
  project: default
  source:
    repoURL: https://github.com/gorttman/day1-foundation.git
    targetRevision: main
    path: apps/qnap-storage
  destination:
    server: https://kubernetes.default.svc
  # The binding controller writes uid/resourceVersion back into every
  # claimRef we pre-declare. Without this the app would sit permanently
  # OutOfSync and selfHeal would keep trying to patch the uid back out
  # from under a bound PV.
  ignoreDifferences:
    - group: ""
      kind: PersistentVolume
      jsonPointers:
        - /spec/claimRef/uid
        - /spec/claimRef/resourceVersion
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
